<form class="grid grid-cols-1 gap-5" data-bs-validate novalidate>
   <div class="form-group">
      <label class="form-label">Vos identifiants de connexion</label>
      <div class="form-field mb-1">
         <label for="email" class="form-label">Email</label>
         <input type="email" id="email" class="form-control" name="email" placeholder="Entrez votre email" required>
         <div id="emailFeedback" class="invalid-feedback">Veuillez entrer un email valide</div>
         </div>
      </div>
   <div>
      <label for="password2" class="form-label">Password</label>
      <input type="password" class="form-control" id="password2" placeholder="Enter password" required aria-describedby="password2Feedback" data-bs-strength>
      <div id="password2Feedback" class="invalid-feedback">Votre mot de passe doit contenir au moins 10 caractères, dont une majuscule, une minuscule, un chiffre et un caractère spécial.</div>
      </div>
   </div>

   <button class="btn-solid theme-primary justify-self-start" type="submit">Submit form</button>
</form>
